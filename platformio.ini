; PlatformIO build for the TELLTALE firmware (ESP32 DevKit, Arduino core 2.0.x).
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      serial log at 115200
[platformio]
src_dir = firmware/telltale

[env:esp32dev]
platform = espressif32@^6
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^6.21.3
