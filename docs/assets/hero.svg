<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">TELLTALE</title>
  <desc id="d">A fingerprint door lock whose own servo is the tamper sensor: a pry bar pushes the bolt, the servo horn twitches, the servo current rises and the trace is flagged as forced while locked.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D3D7DB" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#B8BEC4" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E5383B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E5383B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V6" stroke="#E5383B" stroke-width="2" opacity=".35"/>
    </pattern>
  </defs>

  <!-- bench -->
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="#F7F8F9" stroke="#D3D7DB" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="1198" height="418" rx="14" fill="url(#grid5)" opacity=".6"/>
  <g fill="none" stroke="#B8BEC4" stroke-width="2">
    <path d="M18 42V18H42"/><path d="M1158 18H1182V42"/><path d="M1182 378V402H1158"/><path d="M42 402H18V378"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Chakra Petch','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <g transform="translate(64 112)">
      <path d="M8 18V12a12 12 0 0 1 24 0v6" fill="none" stroke="#14171A" stroke-width="2.6"/>
      <rect x="2" y="18" width="36" height="24" rx="4" fill="#FDFDFE" stroke="#14171A" stroke-width="2.4"/>
      <path d="M8 31h5l3-6 4 11 3-8 2 3h7" fill="none" stroke="#E5383B" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <text x="122" y="146" font-size="50" font-weight="700" fill="#14171A" textLength="270" lengthAdjust="spacingAndGlyphs">TELLTALE<tspan fill="#E5383B">.</tspan></text>
  </g>
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" fill="#4A5157">
    <text x="66" y="194" font-size="12.5" textLength="374" lengthAdjust="spacingAndGlyphs">PROPRIOCEPTIVE TAMPER SENSING · ESP32 · SG90 · INA219</text>
    <text x="66" y="230" font-size="15.5" fill="#14171A" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" textLength="374" lengthAdjust="spacingAndGlyphs">The motor that locks the door also feels who's forcing it.</text>
  </g>

  <!-- state chips -->
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="700">
    <g transform="translate(66 262)">
      <rect width="104" height="34" rx="6" fill="#3D5A80"/><circle cx="16" cy="17" r="4" fill="#fff"/>
      <text x="28" y="22" fill="#fff" textLength="64" lengthAdjust="spacingAndGlyphs">LOCKED</text>
    </g>
    <g transform="translate(180 262)">
      <rect width="104" height="34" rx="6" fill="#FDFDFE" stroke="#3D5A80" stroke-width="1.6"/><circle cx="16" cy="17" r="4" fill="#3D5A80"/>
      <text x="28" y="22" fill="#3D5A80" textLength="64" lengthAdjust="spacingAndGlyphs">LEARNED</text>
    </g>
    <g transform="translate(294 262)">
      <rect width="102" height="34" rx="6" fill="#FDFDFE" stroke="#E5383B" stroke-width="1.6"/>
      <circle cx="16" cy="17" r="4" fill="#E5383B">
        <animate attributeName="opacity" values="0;0;1;0;1;1;0" keyTimes="0;.45;.5;.55;.6;.85;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="22" fill="#E5383B" textLength="62" lengthAdjust="spacingAndGlyphs">TAMPER</text>
    </g>
  </g>

  <!-- scope trace: holding current, prying, flagged -->
  <g transform="translate(66 318)">
    <rect width="330" height="62" rx="5" fill="#FDFDFE" stroke="#D3D7DB"/>
    <path d="M0 31H330M82 0V62M165 0V62M247 0V62" stroke="#ECEEF0"/>
    <rect x="150" y="6" width="120" height="50" fill="url(#hatch)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.55;.85;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 48 L120 48 L124 46 L128 49 L132 48 L150 47 C 160 40, 168 22, 180 18 L200 17 L210 19 L222 16 L240 18 L258 17 L268 19 C 276 30, 282 46, 290 48 L330 48" fill="none" stroke="#E5383B" stroke-width="2.4" stroke-dasharray="560" stroke-dashoffset="560">
      <animate attributeName="stroke-dashoffset" values="560;560;0;0" keyTimes="0;.1;.85;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 52H330" stroke="#3D5A80" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/>
    <text x="6" y="14" font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="9.5" fill="#828A90" textLength="98" lengthAdjust="spacingAndGlyphs">SERVO CURRENT · mA</text>
  </g>

  <!-- lock bench -->
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="11" fill="#828A90">
    <g transform="translate(470 52)">
      <rect width="700" height="316" rx="10" fill="#FDFDFE" stroke="#D3D7DB"/>
      <text x="16" y="26" textLength="210" lengthAdjust="spacingAndGlyphs">LOCKED · THE SERVO IS THE SENSOR</text>

      <!-- door frame with strike -->
      <rect x="34" y="52" width="58" height="236" rx="4" fill="#ECEEF0" stroke="#B8BEC4" stroke-width="1.4"/>
      <rect x="62" y="150" width="30" height="40" fill="#FDFDFE" stroke="#B8BEC4"/>
      <!-- door edge and lock case -->
      <rect x="96" y="52" width="2" height="236" fill="#B8BEC4"/>
      <rect x="150" y="128" width="250" height="84" rx="8" fill="#F7F8F9" stroke="#D3D7DB" stroke-width="1.4"/>

      <!-- bolt, latch spring and linkage (move together when pried) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;7 0;9 0;7 0;0 0" keyTimes="0;.4;.55;.7;.85;1" dur="4s" repeatCount="indefinite"/>
        <rect x="66" y="157" width="132" height="26" rx="3" fill="#3D5A80"/>
        <rect x="66" y="157" width="18" height="26" rx="3" fill="#2C4462"/>
        <path d="M198 170 l8 -9 l8 18 l8 -18 l8 18 l8 -18 l8 18 l8 -9" fill="none" stroke="#828A90" stroke-width="2"/>
        <circle cx="198" cy="170" r="4" fill="#14171A"/>
      </g>
      <path d="M200 170 C 250 170, 280 150, 318 146" fill="none" stroke="#14171A" stroke-width="2.2" stroke-dasharray="5 3">
        <animate attributeName="d" values="M200 170 C 250 170, 280 150, 318 146;M200 170 C 250 170, 280 150, 318 146;M209 170 C 256 174, 286 160, 316 156;M200 170 C 250 170, 280 150, 318 146" keyTimes="0;.4;.7;1" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- servo with horn -->
      <g transform="translate(340 170)">
        <circle r="64" fill="url(#glow)" opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.55;.85;1" dur="4s" repeatCount="indefinite"/>
        </circle>
        <rect x="-34" y="-30" width="96" height="60" rx="6" fill="#14171A"/>
        <rect x="-44" y="-8" width="12" height="16" rx="2" fill="#14171A"/>
        <rect x="60" y="-8" width="12" height="16" rx="2" fill="#14171A"/>
        <text x="10" y="21" fill="#B8BEC4" font-size="10" textLength="30" lengthAdjust="spacingAndGlyphs">SG90</text>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;0;-9;-6;-9;0" keyTimes="0;.4;.55;.65;.8;1" dur="4s" repeatCount="indefinite"/>
          <path d="M-4 -6 L-24 -22 a5 5 0 0 1 6 -7 L4 -8 Z" fill="#FDFDFE" stroke="#828A90" stroke-width="1.2"/>
          <circle r="8" fill="#FDFDFE" stroke="#828A90" stroke-width="1.4"/>
          <circle r="3" fill="#E5383B"/>
        </g>
      </g>

      <!-- INA219 on the servo supply -->
      <g transform="translate(456 222)">
        <path d="M-18 -16 C -10 -30, -40 -40, -60 -42" fill="none" stroke="#E5383B" stroke-width="1.6"/>
        <path d="M-18 -8 C -6 -34, -30 -48, -56 -46" fill="none" stroke="#14171A" stroke-width="1.6"/>
        <rect x="-18" y="-20" width="70" height="40" rx="4" fill="#3D5A80"/>
        <rect x="-8" y="-6" width="16" height="12" rx="1" fill="#14171A"/>
        <text x="12" y="4" fill="#FDFDFE" font-size="9.5" textLength="36" lengthAdjust="spacingAndGlyphs">INA219</text>
      </g>

      <!-- pry bar and force -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="-12 18;-12 18;0 0;2 -2;0 0;-12 18" keyTimes="0;.3;.5;.65;.8;1" dur="4s" repeatCount="indefinite"/>
        <path d="M26 282 L60 196 q4 -8 12 -6" fill="none" stroke="#4A5157" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.5;.8;.9" dur="4s" repeatCount="indefinite"/>
        <path d="M84 222 H128 M120 214 L130 222 L120 230" fill="none" stroke="#E5383B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="96" y="246" fill="#E5383B" font-size="11" font-weight="700" textLength="26" lengthAdjust="spacingAndGlyphs">F</text>
      </g>

      <!-- current meter -->
      <g transform="translate(556 60)">
        <rect width="124" height="172" rx="8" fill="#F7F8F9" stroke="#D3D7DB"/>
        <text x="12" y="22" textLength="70" lengthAdjust="spacingAndGlyphs">I · HOLDING</text>
        <rect x="18" y="36" width="22" height="120" rx="3" fill="#ECEEF0"/>
        <rect x="18" y="146" width="22" height="10" rx="3" fill="#3D5A80">
          <animate attributeName="y" values="146;146;64;72;66;146" keyTimes="0;.45;.6;.7;.8;1" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="height" values="10;10;92;84;90;10" keyTimes="0;.45;.6;.7;.8;1" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="fill" values="#3D5A80;#3D5A80;#E5383B;#E5383B;#3D5A80" keyTimes="0;.5;.55;.85;1" dur="4s" repeatCount="indefinite"/>
        </rect>
        <path d="M14 120 H44" stroke="#14171A" stroke-width="1.4" stroke-dasharray="3 2"/>
        <text x="52" y="124" font-size="9" textLength="56" lengthAdjust="spacingAndGlyphs">CUSUM h</text>
        <text x="52" y="152" font-size="9" fill="#3D5A80" textLength="56" lengthAdjust="spacingAndGlyphs">BASELINE</text>
      </g>

      <!-- alert badge -->
      <g transform="translate(456 262)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;.35;1;1;0" keyTimes="0;.52;.56;.62;.68;.85;.9" dur="4s" repeatCount="indefinite"/>
        <rect width="224" height="34" rx="6" fill="#E5383B"/>
        <text x="14" y="22" fill="#FDFDFE" font-size="12" font-weight="700" textLength="196" lengthAdjust="spacingAndGlyphs">FORCED WHILE LOCKED</text>
      </g>
      <text x="16" y="298" fill="#4A5157" textLength="300" lengthAdjust="spacingAndGlyphs">NO EXTRA SENSORS · CURRENT SIGNATURE ONLY</text>
    </g>
  </g>
</svg>
